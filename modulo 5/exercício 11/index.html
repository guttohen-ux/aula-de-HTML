<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-layout</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        div.container{
            display: grid;
            border: 1px solid lightblue;
            height: 400px;
            grid-template: repeat(4, auto) / repeat(3, auto);
            place-items: normal stretch;
            place-content: normal normal;


        }
        p.text{
            align-content: center;
            text-align: center;
            border: 0.5px dashed lightcoral;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="text">a</p>
        <p class="text">b</p>
        <p class="text">c</p>
        <p class="text">d</p>
        <p class="text">e</p>
        <p class="text">f</p>
        <p class="text">g</p>
        <p class="text">h</p>
        <p class="text">i</p>
    </div>
</body>
</html>
