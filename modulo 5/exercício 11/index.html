<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-layout</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        div.container{
            display: grid;
            margin: 10px auto;
            border: 1px solid lightblue;
            height: 321px;
            width: 600px;
            grid-template-rows: repeat(4, 100px);
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            align-content: start;
            justify-content: center;

        }
        p.text{
            text-align: center;
            border: 1px dashed lightcoral;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="text">a</p>
        <p class="text">b</p>
        <p class="text">c</p>
        <p class="text">d</p>
        <p class="text">e</p>
        <p class="text">f</p>
        <p class="text">g</p>
    </div>
</body>
</html>
